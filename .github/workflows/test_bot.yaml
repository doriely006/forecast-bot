name: Test Bot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Manual only. Forecasts up to TEST_MAX_QUESTIONS (default 3) questions from
# the bot-testing-area tournament. Sends nothing unless PUBLISH is 1.
jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The whole virtualenv is cached; when poetry.lock is unchanged the
      # install steps below are skipped entirely.
      - name: Load cached venv
        id: venv-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
      - name: Install poetry (cache miss only)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies (cache miss only)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --without dev
      # v0.2.0: the Anthropic spend record lives in .state (same cache as the tournament workflow)
      - name: Restore saved state (Anthropic / OpenAI usage record)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Run bot
        run: .venv/bin/python main.py --mode test_questions
        # Keys come only from repository secrets; switches from repository variables.
        env:
          PYTHONUNBUFFERED: "1"
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
          PUBLISH: ${{ vars.PUBLISH }}
          TEST_MAX_QUESTIONS: ${{ vars.TEST_MAX_QUESTIONS }}
          MIN_MINUTES_BEFORE_CLOSE: ${{ vars.MIN_MINUTES_BEFORE_CLOSE }}
          MAIN_FORECAST_MODEL: ${{ vars.MAIN_FORECAST_MODEL }}
          ASSUMED_BUDGET_USD: ${{ vars.ASSUMED_BUDGET_USD }}
          BUDGET_STOP_BELOW: ${{ vars.BUDGET_STOP_BELOW }}
          BUDGET_RESERVE: ${{ vars.BUDGET_RESERVE }}
          BINARY_MIN: ${{ vars.BINARY_MIN }}
          BINARY_MAX: ${{ vars.BINARY_MAX }}
          MC_MIN_PROB: ${{ vars.MC_MIN_PROB }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          ANTHROPIC_FORECAST_MODEL: ${{ vars.ANTHROPIC_FORECAST_MODEL }}
          ANTHROPIC_RESEARCH_MODEL: ${{ vars.ANTHROPIC_RESEARCH_MODEL }}
          ANTHROPIC_FORECAST_PRICE: ${{ vars.ANTHROPIC_FORECAST_PRICE }}
          ANTHROPIC_RESEARCH_PRICE: ${{ vars.ANTHROPIC_RESEARCH_PRICE }}
          ANTHROPIC_EFFORT: ${{ vars.ANTHROPIC_EFFORT }}
          ANTHROPIC_RESEARCH_EFFORT: ${{ vars.ANTHROPIC_RESEARCH_EFFORT }}
          ANTHROPIC_MAX_TOKENS: ${{ vars.ANTHROPIC_MAX_TOKENS }}
          ANTHROPIC_BUDGET_USD: ${{ vars.ANTHROPIC_BUDGET_USD }}
          ANTHROPIC_CREDIT_RESET_DAY: ${{ vars.ANTHROPIC_CREDIT_RESET_DAY }}
          ANTHROPIC_FALLBACKS: ${{ vars.ANTHROPIC_FALLBACKS }}
          ANTHROPIC_WEB_SEARCH_TOOL: ${{ vars.ANTHROPIC_WEB_SEARCH_TOOL }}
          ANTHROPIC_WEB_SEARCH_MAX_USES: ${{ vars.ANTHROPIC_WEB_SEARCH_MAX_USES }}
          OPENAI_FORECAST_MODEL: ${{ vars.OPENAI_FORECAST_MODEL }}
          OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL }}
          OPENAI_PARSE_MODEL: ${{ vars.OPENAI_PARSE_MODEL }}
          OPENAI_FORECAST_PRICE: ${{ vars.OPENAI_FORECAST_PRICE }}
          OPENAI_RESEARCH_PRICE: ${{ vars.OPENAI_RESEARCH_PRICE }}
          OPENAI_PARSE_PRICE: ${{ vars.OPENAI_PARSE_PRICE }}
          OPENAI_EFFORT: ${{ vars.OPENAI_EFFORT }}
          OPENAI_RESEARCH_EFFORT: ${{ vars.OPENAI_RESEARCH_EFFORT }}
          OPENAI_MAX_TOKENS: ${{ vars.OPENAI_MAX_TOKENS }}
          OPENAI_BUDGET_USD: ${{ vars.OPENAI_BUDGET_USD }}
          OPENAI_BUDGET_STOP_BELOW: ${{ vars.OPENAI_BUDGET_STOP_BELOW }}
          OPENAI_FREE_DAILY_BIG: ${{ vars.OPENAI_FREE_DAILY_BIG }}
          OPENAI_FREE_DAILY_MINI: ${{ vars.OPENAI_FREE_DAILY_MINI }}
          OPENAI_FREE_MARGIN: ${{ vars.OPENAI_FREE_MARGIN }}
          OPENAI_DEFER_HOURS: ${{ vars.OPENAI_DEFER_HOURS }}
          OPENAI_WEB_SEARCH_MAX_CALLS: ${{ vars.OPENAI_WEB_SEARCH_MAX_CALLS }}
          OPENAI_SEARCH_CONTEXT: ${{ vars.OPENAI_SEARCH_CONTEXT }}
          OPENAI_WEB_SEARCH_COST: ${{ vars.OPENAI_WEB_SEARCH_COST }}
          OPENAI_TOOL_TOKENS_FREE: ${{ vars.OPENAI_TOOL_TOKENS_FREE }}
      - name: Save state
        if: always() && hashFiles('.state/changed') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
