name: Test Bot

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Manual only. Forecasts up to 3 questions from the bot-testing-area tournament.
# Sends nothing unless the repository variable PUBLISH is 1.
jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The whole virtualenv is cached; when poetry.lock is unchanged the
      # install steps below are skipped entirely (saves Actions minutes).
      - name: Load cached venv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
      - name: Install poetry (cache miss only)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies (cache miss only)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --without dev
      - name: Run bot
        run: .venv/bin/python main.py --mode test_questions
        # Keys come only from repository secrets; switches from repository variables.
        # Settings -> Secrets and variables -> Actions
        env:
          PYTHONUNBUFFERED: "1"
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          PUBLISH: ${{ vars.PUBLISH }}
          ALLOW_UNLIMITED_KEY: ${{ vars.ALLOW_UNLIMITED_KEY }}
          BUDGET_ECONOMY_BELOW: ${{ vars.BUDGET_ECONOMY_BELOW }}
          BUDGET_STOP_BELOW: ${{ vars.BUDGET_STOP_BELOW }}
          BINARY_MIN: ${{ vars.BINARY_MIN }}
          BINARY_MAX: ${{ vars.BINARY_MAX }}
          MC_MIN_PROB: ${{ vars.MC_MIN_PROB }}
          MAX_FORECASTS_PER_RUN: ${{ vars.MAX_FORECASTS_PER_RUN }}
