name: diag-minibench (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diag-minibench
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/diag_minibench.py
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
