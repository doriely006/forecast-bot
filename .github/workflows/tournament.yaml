name: Forecast on tournament questions

on:
  workflow_dispatch:
    inputs:
      dry_run_llm:
        description: "Dry run only: also run the AI on a few questions (DRY_RUN_LLM_MAX_QUESTIONS, default 2). Nothing is sent."
        type: boolean
        default: false
  schedule:
    - cron: "7,27,47 * * * *" # FREQUENCY (change only this line): every 20 minutes, never on the hour

# No pull-request triggers of any kind: this public repo never runs
# code from other people's pull requests.
permissions:
  contents: read
  actions: write # only to start the next loop run (gh workflow run)

# Never run two copies at once.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast_job:
    # Master switch: scheduled runs are skipped entirely (no minutes, no
    # emails) while BOT_ENABLED is unset. Any value other than 1 makes the
    # run fail with the reason (precheck.py). Sending needs PUBLISH=1.
    if: github.event_name == 'workflow_dispatch' || vars.BOT_ENABLED != ''
    runs-on: ubuntu-latest
    timeout-minutes: 350 # loop 300 min + cap; GitHub max is 360
    env:
      PYTHONUNBUFFERED: "1"
      BOT_ENABLED: ${{ vars.BOT_ENABLED }}
      PUBLISH: ${{ vars.PUBLISH }}
      DRY_RUN_LLM: ${{ inputs.dry_run_llm && '1' || '' }}
      DRY_RUN_LLM_MAX_QUESTIONS: ${{ vars.DRY_RUN_LLM_MAX_QUESTIONS }}
      MAIN_FORECAST_MODEL: ${{ vars.MAIN_FORECAST_MODEL }}
      MINIBENCH_FORECAST_MODEL: ${{ vars.MINIBENCH_FORECAST_MODEL }}
      ASSUMED_BUDGET_USD: ${{ vars.ASSUMED_BUDGET_USD }}
      BUDGET_STOP_BELOW: ${{ vars.BUDGET_STOP_BELOW }}
      BUDGET_RESERVE: ${{ vars.BUDGET_RESERVE }}
      BUDGET_SPLIT_DATE: ${{ vars.BUDGET_SPLIT_DATE }}
      MAIN_BUDGET_SHARE: ${{ vars.MAIN_BUDGET_SHARE }}
      MINIBENCH_MINIMUM_AFTER_SPLIT: ${{ vars.MINIBENCH_MINIMUM_AFTER_SPLIT }}
      MAIN_QUESTIONS_PER_DAY: ${{ vars.MAIN_QUESTIONS_PER_DAY }}
      MINIBENCH_QUESTIONS_PER_DAY: ${{ vars.MINIBENCH_QUESTIONS_PER_DAY }}
      SEASON_END: ${{ vars.SEASON_END }}
      BINARY_MIN: ${{ vars.BINARY_MIN }}
      BINARY_MAX: ${{ vars.BINARY_MAX }}
      MC_MIN_PROB: ${{ vars.MC_MIN_PROB }}
      BOT_USERNAME: ${{ vars.BOT_USERNAME }}
      MAX_QUESTION_FAILED_RUNS: ${{ vars.MAX_QUESTION_FAILED_RUNS }}
      SKIP_COOLDOWN_HOURS: ${{ vars.SKIP_COOLDOWN_HOURS }}
      MIN_MINUTES_BEFORE_CLOSE: ${{ vars.MIN_MINUTES_BEFORE_CLOSE }}
      REFORECAST_HOURS_BEFORE_CLOSE: ${{ vars.REFORECAST_HOURS_BEFORE_CLOSE }}
      # v0.2.0: Anthropic API path (used when there is no OpenRouter key, or LLM_PROVIDER=anthropic)
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LOG_RESEARCH: ${{ vars.LOG_RESEARCH }}
      # v0.4.0: per-tournament provider (unset = LLM_PROVIDER / key order); _FROM = UTC date it starts
      MAIN_LLM_PROVIDER: ${{ vars.MAIN_LLM_PROVIDER }}
      MAIN_LLM_PROVIDER_FROM: ${{ vars.MAIN_LLM_PROVIDER_FROM }}
      MINIBENCH_LLM_PROVIDER: ${{ vars.MINIBENCH_LLM_PROVIDER }}
      MINIBENCH_LLM_PROVIDER_FROM: ${{ vars.MINIBENCH_LLM_PROVIDER_FROM }}
      ANTHROPIC_FORECAST_MODEL: ${{ vars.ANTHROPIC_FORECAST_MODEL }}
      ANTHROPIC_RESEARCH_MODEL: ${{ vars.ANTHROPIC_RESEARCH_MODEL }}
      ANTHROPIC_FORECAST_PRICE: ${{ vars.ANTHROPIC_FORECAST_PRICE }}
      ANTHROPIC_RESEARCH_PRICE: ${{ vars.ANTHROPIC_RESEARCH_PRICE }}
      ANTHROPIC_EFFORT: ${{ vars.ANTHROPIC_EFFORT }}
      ANTHROPIC_RESEARCH_EFFORT: ${{ vars.ANTHROPIC_RESEARCH_EFFORT }}
      ANTHROPIC_MAX_TOKENS: ${{ vars.ANTHROPIC_MAX_TOKENS }}
      ANTHROPIC_BUDGET_USD: ${{ vars.ANTHROPIC_BUDGET_USD }}
      ANTHROPIC_CREDIT_RESET_DAY: ${{ vars.ANTHROPIC_CREDIT_RESET_DAY }}
      ANTHROPIC_FALLBACKS: ${{ vars.ANTHROPIC_FALLBACKS }}
      ANTHROPIC_WEB_SEARCH_TOOL: ${{ vars.ANTHROPIC_WEB_SEARCH_TOOL }}
      ANTHROPIC_WEB_SEARCH_MAX_USES: ${{ vars.ANTHROPIC_WEB_SEARCH_MAX_USES }}
      # v0.3.0: OpenAI API path (no OpenRouter/Anthropic key, or LLM_PROVIDER=openai)
      OPENAI_FORECAST_MODEL: ${{ vars.OPENAI_FORECAST_MODEL }}
      OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL }}
      OPENAI_PARSE_MODEL: ${{ vars.OPENAI_PARSE_MODEL }}
      OPENAI_FORECAST_PRICE: ${{ vars.OPENAI_FORECAST_PRICE }}
      OPENAI_RESEARCH_PRICE: ${{ vars.OPENAI_RESEARCH_PRICE }}
      OPENAI_PARSE_PRICE: ${{ vars.OPENAI_PARSE_PRICE }}
      OPENAI_EFFORT: ${{ vars.OPENAI_EFFORT }}
      OPENAI_RESEARCH_EFFORT: ${{ vars.OPENAI_RESEARCH_EFFORT }}
      OPENAI_MAX_TOKENS: ${{ vars.OPENAI_MAX_TOKENS }}
      OPENAI_BUDGET_USD: ${{ vars.OPENAI_BUDGET_USD }}
      OPENAI_BUDGET_STOP_BELOW: ${{ vars.OPENAI_BUDGET_STOP_BELOW }}
      OPENAI_FREE_DAILY_BIG: ${{ vars.OPENAI_FREE_DAILY_BIG }}
      OPENAI_FREE_DAILY_MINI: ${{ vars.OPENAI_FREE_DAILY_MINI }}
      OPENAI_FREE_MARGIN: ${{ vars.OPENAI_FREE_MARGIN }}
      OPENAI_DEFER_HOURS: ${{ vars.OPENAI_DEFER_HOURS }}
      OPENAI_WEB_SEARCH_MAX_CALLS: ${{ vars.OPENAI_WEB_SEARCH_MAX_CALLS }}
      OPENAI_SEARCH_CONTEXT: ${{ vars.OPENAI_SEARCH_CONTEXT }}
      OPENAI_WEB_SEARCH_COST: ${{ vars.OPENAI_WEB_SEARCH_COST }}
      OPENAI_TOOL_TOKENS_FREE: ${{ vars.OPENAI_TOOL_TOKENS_FREE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Restore comments waiting to be re-sent
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Standings (once a day)
        continue-on-error: true
        run: python3 standings.py --daily
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          MAIN_CLAUDE_FROM: ${{ vars.MAIN_CLAUDE_FROM }}
          MINIBENCH_CLAUDE_FROM: ${{ vars.MINIBENCH_CLAUDE_FROM }}
          STOP_LOSS_MIN_AVG: ${{ vars.STOP_LOSS_MIN_AVG }}
      # v0.4.9: install once, whatever precheck says (the loop below may need it
      # any round). Cache hit = seconds.
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Load cached venv
        id: venv-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
      - name: Install poetry (cache miss only)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies (cache miss only)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --without dev
      # v0.4.9: GitHub fires the cron only 2-5 times a day, but questions are open
      # ~3h. So one job loops for up to 300 min: every round = precheck.py (light,
      # system Python) -> main.py only if it says work=true -> sleep to the next
      # :07/:27/:47 UTC. precheck exit 1 (BOT_ENABLED not 1, budget/systemic) ends
      # the job red. main.py failing 3 rounds in a row ends it red too. Normal end
      # -> the next step hands over to a fresh run (relay).
      - name: Run bot (loop)
        id: loop
        shell: bash
        run: |
          set -u
          LOOP_MIN=300       # no new round after this; timeout-minutes is 350
          MAIN_CAP_MIN=325   # a round's main.py is killed at this loop minute
          START=$SECONDS
          mkdir -p .state
          fails=0
          round=0
          while :; do
            round=$((round + 1))
            echo "::group::round $round precheck $(date -u +%FT%TZ)"
            echo "round $round precheck at $(date -u +%FT%TZ)"
            export GITHUB_OUTPUT="$RUNNER_TEMP/precheck_out_$round"
            : > "$GITHUB_OUTPUT"
            python3 precheck.py && pc=0 || pc=$?
            [ -f .state/changed ] && touch "$RUNNER_TEMP/state_changed"
            echo "::endgroup::"
            if [ "$pc" -ne 0 ]; then
              echo "::error::precheck failed (exit $pc), loop stops"
              exit "$pc"
            fi
            if grep -qx 'work=true' "$GITHUB_OUTPUT"; then
              left=$(( MAIN_CAP_MIN * 60 - (SECONDS - START) ))
              [ "$left" -lt 60 ] && left=60
              echo "round $round main.py at $(date -u +%FT%TZ) (cap ${left}s)"
              timeout "$left" .venv/bin/python main.py --mode tournament && mc=0 || mc=$?
              [ -f .state/changed ] && touch "$RUNNER_TEMP/state_changed"
              if [ "$mc" -ne 0 ]; then
                fails=$((fails + 1))
                echo "::warning::main.py exit $mc (consecutive failures: $fails)"
                if [ "$fails" -ge 3 ]; then
                  echo "::error::main.py failed 3 rounds in a row, loop stops"
                  exit "$mc"
                fi
              else
                fails=0
              fi
            else
              echo "round $round: no work"
            fi
            if [ "${DRY_RUN_LLM:-}" = "1" ]; then
              echo "dry_run_llm: single round"
              break
            fi
            # sleep to the next :07/:27/:47 UTC
            m=$(date -u +%-M); s=$(date -u +%-S); wait=0
            for t in 7 27 47 67; do
              if [ "$t" -gt "$m" ]; then wait=$(( (t - m) * 60 - s )); break; fi
            done
            if [ $(( SECONDS - START + wait )) -ge $(( LOOP_MIN * 60 )) ]; then
              echo "loop deadline reached after round $round ($(date -u +%FT%TZ))"
              break
            fi
            echo "sleeping ${wait}s (until $(date -u -d "+${wait} seconds" +%FT%TZ))"
            sleep "$wait"
          done
        # Keys come only from repository secrets; switches from repository variables.
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          SUMMARY_HEADER_DONE: "1"
      # Relay: only after a normal end (success()), only while BOT_ENABLED=1, never
      # for a dry_run_llm dispatch. Cancelled/failed jobs do not relay (cron restarts).
      # The concurrency group keeps one pending run, so this and a queued cron run
      # never run side by side.
      - name: Hand over to the next run
        if: success() && vars.BOT_ENABLED == '1' && inputs.dry_run_llm != true
        run: gh workflow run tournament.yaml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # precheck.py clears .state/changed every round; the loop remembers any
      # round that changed state, and this puts the flag back before the save.
      - name: Mark state changed
        if: always()
        run: |
          mkdir -p .state
          if [ -f "$RUNNER_TEMP/state_changed" ]; then touch .state/changed; fi
      - name: Save comments waiting to be re-sent
        if: always() && hashFiles('.state/changed') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
