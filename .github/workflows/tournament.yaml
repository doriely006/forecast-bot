name: Forecast on tournament questions

on:
  workflow_dispatch:
    inputs:
      dry_run_llm:
        description: "Dry run only: also run the AI on a few questions (DRY_RUN_LLM_MAX_QUESTIONS, default 2). Nothing is sent."
        type: boolean
        default: false
  schedule:
    - cron: "7,27,47 * * * *" # FREQUENCY (change only this line): every 20 minutes, never on the hour

# No pull-request triggers of any kind: this public repo never runs
# code from other people's pull requests.
permissions:
  contents: read

# Never run two copies at once.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast_job:
    # Master switch: scheduled runs are skipped entirely (no minutes, no
    # emails) while BOT_ENABLED is unset. Any value other than 1 makes the
    # run fail with the reason (precheck.py). Sending needs PUBLISH=1.
    if: github.event_name == 'workflow_dispatch' || vars.BOT_ENABLED != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
      BOT_ENABLED: ${{ vars.BOT_ENABLED }}
      PUBLISH: ${{ vars.PUBLISH }}
      DRY_RUN_LLM: ${{ inputs.dry_run_llm && '1' || '' }}
      DRY_RUN_LLM_MAX_QUESTIONS: ${{ vars.DRY_RUN_LLM_MAX_QUESTIONS }}
      MAIN_FORECAST_MODEL: ${{ vars.MAIN_FORECAST_MODEL }}
      MINIBENCH_FORECAST_MODEL: ${{ vars.MINIBENCH_FORECAST_MODEL }}
      ASSUMED_BUDGET_USD: ${{ vars.ASSUMED_BUDGET_USD }}
      BUDGET_STOP_BELOW: ${{ vars.BUDGET_STOP_BELOW }}
      BUDGET_RESERVE: ${{ vars.BUDGET_RESERVE }}
      BUDGET_SPLIT_DATE: ${{ vars.BUDGET_SPLIT_DATE }}
      MAIN_BUDGET_SHARE: ${{ vars.MAIN_BUDGET_SHARE }}
      MAIN_QUESTIONS_PER_DAY: ${{ vars.MAIN_QUESTIONS_PER_DAY }}
      MINIBENCH_QUESTIONS_PER_DAY: ${{ vars.MINIBENCH_QUESTIONS_PER_DAY }}
      SEASON_END: ${{ vars.SEASON_END }}
      BINARY_MIN: ${{ vars.BINARY_MIN }}
      BINARY_MAX: ${{ vars.BINARY_MAX }}
      MC_MIN_PROB: ${{ vars.MC_MIN_PROB }}
      BOT_USERNAME: ${{ vars.BOT_USERNAME }}
      MAX_QUESTION_FAILED_RUNS: ${{ vars.MAX_QUESTION_FAILED_RUNS }}
      SKIP_COOLDOWN_HOURS: ${{ vars.SKIP_COOLDOWN_HOURS }}
      # v0.2.0: Anthropic API path (used when there is no OpenRouter key, or LLM_PROVIDER=anthropic)
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      ANTHROPIC_FORECAST_MODEL: ${{ vars.ANTHROPIC_FORECAST_MODEL }}
      ANTHROPIC_RESEARCH_MODEL: ${{ vars.ANTHROPIC_RESEARCH_MODEL }}
      ANTHROPIC_FORECAST_PRICE: ${{ vars.ANTHROPIC_FORECAST_PRICE }}
      ANTHROPIC_RESEARCH_PRICE: ${{ vars.ANTHROPIC_RESEARCH_PRICE }}
      ANTHROPIC_EFFORT: ${{ vars.ANTHROPIC_EFFORT }}
      ANTHROPIC_RESEARCH_EFFORT: ${{ vars.ANTHROPIC_RESEARCH_EFFORT }}
      ANTHROPIC_MAX_TOKENS: ${{ vars.ANTHROPIC_MAX_TOKENS }}
      ANTHROPIC_BUDGET_USD: ${{ vars.ANTHROPIC_BUDGET_USD }}
      ANTHROPIC_CREDIT_RESET_DAY: ${{ vars.ANTHROPIC_CREDIT_RESET_DAY }}
      ANTHROPIC_FALLBACKS: ${{ vars.ANTHROPIC_FALLBACKS }}
      ANTHROPIC_WEB_SEARCH_TOOL: ${{ vars.ANTHROPIC_WEB_SEARCH_TOOL }}
      ANTHROPIC_WEB_SEARCH_MAX_USES: ${{ vars.ANTHROPIC_WEB_SEARCH_MAX_USES }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Restore comments waiting to be re-sent
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: state-
      # Light step on the runner's own Python, nothing installed: checks the
      # switches, lists open questions, re-sends pending comments, and decides
      # whether there is anything to forecast. Idle runs end here.
      - name: Quick check
        id: precheck
        run: python3 precheck.py
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
      - name: Standings (once a day)
        continue-on-error: true
        run: python3 standings.py --daily
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      - name: Set up Python
        if: steps.precheck.outputs.work == 'true'
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Load cached venv
        if: steps.precheck.outputs.work == 'true'
        id: venv-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
      - name: Install poetry (cache miss only)
        if: steps.precheck.outputs.work == 'true' && steps.venv-cache.outputs.cache-hit != 'true'
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies (cache miss only)
        if: steps.precheck.outputs.work == 'true' && steps.venv-cache.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --without dev
      - name: Run bot
        if: steps.precheck.outputs.work == 'true'
        run: .venv/bin/python main.py --mode tournament
        # Keys come only from repository secrets; switches from repository variables.
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          SUMMARY_HEADER_DONE: "1"
      - name: Save comments waiting to be re-sent
        if: always() && hashFiles('.state/changed') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
