[tool.poetry]
name = "forecast-bot"
version = "0.1.5"
description = "Metaculus FutureEval Fall 2026 + MiniBench bot (based on Metaculus/metac-bot-template)"
authors = ["doriely006"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
python-decouple = "^3.8"
requests = "^2.32.3"
asknews = "^0.13.11"
numpy = "^2.3.0"
openai = "^2.0.0"
python-dotenv = "^1.0.1"
forecasting-tools = ">=0.3.0,<0.4.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pyyaml = "^6.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
